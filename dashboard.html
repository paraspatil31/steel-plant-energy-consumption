
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Microplastic Detection Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
}

header {
    background: #ffffff;
    color: rgb(8, 8, 8);
    padding: 20px;
    text-align: center;
}

.dashboard {
    padding: 20px;
}

.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    flex: 1;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    font-size: 28px;
    color: #0d47a1;
}

.status {
    font-size: 20px;
    font-weight: b
      old;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>Microplastic Detection Dashboard</h1>
    <p>Hardware-Based Water Quality Monitoring</p>
</header>

<div class="dashboard">

    <div class="cards">
        <div class="card">
            <h3>Total Microplastics</h3>
            <p id="totalParticles">--</p>
        </div>
        <div class="card">
            <h3>Average Size (µm)</h3>
            <p id="avgSize">--</p>
        </div>
        <div class="card">
            <h3>Concentration (particles/L)</h3>
            <p id="concentration">--</p>
        </div>
        <div class="card">
            <h3>Status</h3>
            <p id="status" class="status">--</p>
        </div>
    </div>

    <div class="section">
        <h2>Particle Shape Distribution</h2>
        <canvas id="shapeChart"></canvas>
    </div>

</div>

<script>
/*
    Temporary random data for visualization.
    Cards and graph updated with the same values.
    Will be replaced by real hardware values later.
*/

// Generate random values
const totalParticles = Math.floor(Math.random() * 200) + 50; // 50 - 250
const avgSize = Math.floor(Math.random() * 200) + 20; // 20 - 220 µm
const concentration = Math.floor(Math.random() * 500) + 50; // 50 - 550 particles/L

// Assign status based on totalParticles (example logic)
let statusText = "Low";
if (totalParticles > 180) statusText = "High";
else if (totalParticles > 100) statusText = "Moderate";

// Update cards
document.getElementById("totalParticles").innerText = totalParticles;
document.getElementById("avgSize").innerText = avgSize;
document.getElementById("concentration").innerText = concentration;
const statusEl = document.getElementById("status");
statusEl.innerText = statusText;
statusEl.className = "status " + statusText.toLowerCase();

// Use same values for plastic graph (randomly split among PE, PP, PS)
const pe = Math.floor(totalParticles * Math.random());
const pp = Math.floor(totalParticles * Math.random());
const ps = totalParticles - pe - pp;

const ctx = document.getElementById("shapeChart");

new Chart(ctx, {
    type: "bar",
    data: {
        labels: [
            "Polyethylene (PE)",
            "Polypropylene (PP)",
            "Polystyrene (PS)"
        ],
        datasets: [{
            label: "Detected Microplastic Count",
            data: [pe, pp, ps],
            backgroundColor: [
                "#1e88e5",
                "#43a047",
                "#fb8c00"
            ]
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
                title: {
                    display: true,
                    text: "Number of Microplastic Particles"
                }
            },
            x: {
                title: {
                    display: true,
                    text: "Plastic Polymer Type"
                }
            }
        },
        plugins: {
            legend: {
                display: false
            }
        }
    }
});
</script>

</body>
</html>
